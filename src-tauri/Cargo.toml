[package]
name = "film-stack"
version = "1.0.0"
description = "影栈-本地视频播放器"
authors = ["Film-stack"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "film_stack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 后续周次依赖（W2 扫描/哈希/监听），先锁版本避免后期返工
walkdir = "2.5"
sha2 = "0.10"
notify = "6.1"
# W1-4 扫描骨架：Rust 侧直接写入同一 SQLite 文件（插件池的查询方法为 crate-private，消费端不可调用）
rusqlite = { version = "0.32", features = ["bundled"] }
# 日志门面：与 tauri 内部同一套（log），输出不落文件、不含完整路径（C3 日志脱敏）
log = "0.4"
# W2-2 缩略图队列：并发控制与进度等待用的异步定时器
tokio = { version = "1", features = ["time"] }

# W2-2 Windows 系统缩略图（IShellItemImageFactory::GetImage），仅 Windows 生效，不引入外部二进制
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[features]
# 默认无自定义特性；按平台在 tauri.conf.json 选择命令集
default = []
